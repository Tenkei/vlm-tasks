[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ml-pipes-vlm"
version = "0.1.2rc1"
description = "Structured vision-language task operators for ml-pipes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["computer-vision", "ml-pipes", "pipelines", "vision-language", "pydantic-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "ml-pipes-core>=0.1.3,<0.2.0",
    "ml-pipes-vision>=0.1.3,<0.2.0",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pydantic>=2.12",
    "pydantic-ai-slim==2.61.0",
]

[project.urls]
Homepage = "https://github.com/trained-by-humans/vlm-tasks"
Documentation = "https://github.com/trained-by-humans/vlm-tasks/blob/main/docs/reference.md"
Repository = "https://github.com/trained-by-humans/vlm-tasks"
Issues = "https://github.com/trained-by-humans/vlm-tasks/issues"
Changelog = "https://github.com/trained-by-humans/vlm-tasks/releases"

[project.optional-dependencies]
validation = ["datasets[vision]>=4,<5", "PyYAML>=6"]
test = ["pytest>=8", "Pillow>=10", "pydantic-ai-slim[bedrock]"]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_pipes"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE", "/README.md", "/RELEASING.md", "/SECURITY.md",
    "/pyproject.toml", "/src/ml_pipes", "/docs", "/examples", "/tests",
    "/benchmarks/__init__.py", "/benchmarks/src/*.py", "/benchmarks/configs/*.json",
    "/benchmarks/methodology.md",
    "/.github/CONTRIBUTING.md",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
